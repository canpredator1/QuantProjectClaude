# Daily paper-trading run: settle finished markets, forecast new ones, commit the ledger.
# Requires the repository secret ANTHROPIC_API_KEY. Read-only market data; no trading.
name: polymarket-paper

on:
  schedule:
    - cron: "17 7 * * *"      # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/pm.py settle
      - run: python scripts/pm.py forecast
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/pm.py score
      - name: Commit ledger
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper/ledger.jsonl
          git diff --cached --quiet || git commit -m "Paper ledger update $(date -u +%F)"
          git push
